name: approve fork runs

# A workflow run started by a pull request from a fork does not begin until
# someone with write access approves it. The repository setting cannot remove
# that: its lightest option still requires approval for accounts that are new
# to GitHub, so a first-time contributor's pull request sits on "Awaiting
# approval" with no result, and the state of the change is unknown to us and
# to them. This workflow approves those runs itself, which is the only
# unattended path the API offers (`POST /actions/runs/{id}/approve`).
#
# The permission is not granted blindly. A pull request that touches
# `.github/` waits for a maintainer: it can edit this file, ci.yml or any
# other workflow, and approving it would run that edit rather than the code
# the pull request says it changes. Everything else runs with the read-only
# token and no secrets GitHub already gives a fork's pull request.
#
# Setting the APPROVE_FORK_RUNS repository variable to `off` stops it without
# touching this file.

on:
  # Runs in the context of the base branch, so this event is never itself
  # held for approval, and it fires exactly when a fork's run is created.
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Covers a run created between events, or one GitHub did not deliver. A run
  # left awaiting approval expires after thirty days and is marked failed.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: approve-fork-runs-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  approve:
    if: vars.APPROVE_FORK_RUNS != 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const OWNER = context.repo.owner, REPO = context.repo.repo;

            // Workflows and the repository configuration a run reads are a
            // maintainer decision, never an automatic approval.
            const MAINTAINER_ONLY = /^\.github\//;

            // One lookup per pull request, however many runs it opened.
            const decided = new Map();

            async function mayApprove(number, sha) {
              if (decided.has(number)) return decided.get(number);

              const { data: pr } = await github.rest.pulls.get({
                owner: OWNER, repo: REPO, pull_number: number,
              });

              // The head is read again here, later than the listing that paired
              // it with the run: a push in between would let this approve a run
              // of the old commit on the new commit's file list. Only a fork's
              // run needs the approval this workflow grants.
              let ok = pr.head.sha === sha && pr.head.repo !== null &&
                       pr.head.repo.full_name !== `${OWNER}/${REPO}`;

              if (ok) {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: OWNER, repo: REPO, pull_number: number, per_page: 100,
                });
                // listFiles stops at 3,000 files even when paginated, so a
                // shorter list than the pull request reports cannot prove the
                // guard and the run waits for a maintainer. `previous_filename`
                // is tested too: a rename out of .github/ passes on `filename`.
                if (files.length < pr.changed_files) {
                  ok = false;
                } else if (files.some((f) => MAINTAINER_ONLY.test(f.filename) ||
                                             MAINTAINER_ONLY.test(f.previous_filename || ''))) {
                  ok = false;
                }
              }

              decided.set(number, ok);
              return ok;
            }

            // `run.pull_requests` is empty for a run whose head lives in a fork:
            // the field only lists pull requests whose branch is in this
            // repository, and every run this workflow exists for is the other
            // kind. The pairing is made from the head instead, and it must be
            // the exact commit: the files above are read at the head of the
            // pull request, so a run of an older commit could otherwise be
            // approved by a later one that reverted a `.github/` change.
            // A deleted fork leaves both sides without a repository name, and
            // a key of `undefined@<sha>` would pair two unrelated things.
            const open = await github.paginate(github.rest.pulls.list, {
              owner: OWNER, repo: REPO, state: 'open', per_page: 100,
            });
            const byHead = new Map();
            for (const pr of open) {
              const head = pr.head.repo && pr.head.repo.full_name;
              if (head) byHead.set(`${head}@${pr.head.sha}`, pr.number);
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: OWNER, repo: REPO, status: 'action_required', per_page: 100 },
            );

            let approved = 0, held = 0;
            for (const run of runs) {
              const number = run.head_repository
                ? byHead.get(`${run.head_repository.full_name}@${run.head_sha}`)
                : undefined;
              if (number === undefined) {
                // Closed, force-pushed past, or a run with no pull request at
                // all: not this workflow's decision to make.
                held++;
                continue;
              }

              if (!(await mayApprove(number, run.head_sha))) {
                held++;
                core.info(`run ${run.id} (${run.name}) left for a maintainer: #${number}`);
                continue;
              }

              try {
                await github.rest.actions.approveWorkflowRun({
                  owner: OWNER, repo: REPO, run_id: run.id,
                });
                approved++;
                core.info(`approved run ${run.id} (${run.name}) for #${number}`);
              } catch (err) {
                // A 403 here means this token may not approve runs at all,
                // which a retry will not fix; a 404 means the run was approved
                // or cancelled between the listing and this call.
                held++;
                core.info(`run ${run.id} not approved: ${err.status} ${err.message}`);
              }
            }

            core.info(`${runs.length} awaiting approval, ${approved} approved, ${held} left alone`);
