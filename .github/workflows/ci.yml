name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only superseded PR runs are cancelled; every main push is validated.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-changes:
    name: Backend changes
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.changes.outputs.run_backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect backend-relevant changes
        id: changes
        run: python3 .github/ci/changes.py

  backend-lint:
    name: Backend Lint
    needs: backend-changes
    if: needs.backend-changes.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Single source of truth with the Docker image: CI must test the
          # same interpreter the backend ships with.
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint with Ruff
        run: uv run --no-sync ruff check .

      - name: Type check with ty
        run: uv run --no-sync ty check .

  # The suite runs in four parallel shards, balanced by the per-test durations
  # in backend/.test_durations (pytest-split). duration_based_chunks cuts the
  # suite, in collection order, into four contiguous runs of tests, so only the
  # files at the three cut points are divided between shards and module setup
  # is rarely repeated. Each shard writes its own coverage data; the Backend
  # Tests job below combines them.
  backend-shard:
    name: Backend Tests (shard ${{ matrix.group }}/4)
    needs: backend-changes
    if: needs.backend-changes.outputs.run_backend != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: securo_test
          POSTGRES_PASSWORD: securo_test
          POSTGRES_DB: securo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U securo_test -d securo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests with coverage
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://securo_test:securo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/securo_test
          COVERAGE_FILE: .coverage.shard${{ matrix.group }}
        run: |
          uv run --no-sync pytest -n auto --dist loadfile \
            --splits 4 --group ${{ matrix.group }} --splitting-algorithm duration_based_chunks \
            --cov=app --cov-report= -ra -W error --store-durations

      # This runner's timings for the tests the shard ran. When the shards
      # drift apart, fold them into .test_durations with
      # .github/ci/merge_test_durations.py (usage in its docstring).
      - name: Upload test durations
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-${{ matrix.group }}
          path: backend/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.group }}
          path: backend/.coverage.shard${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The required status check. It passes only when every shard and the lint
  # job passed (or were skipped because nothing in the backend changed), and
  # enforces the coverage floor on the combined data of all shards.
  backend-tests:
    name: Backend Tests
    needs: [backend-changes, backend-lint, backend-shard]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Every backend job passed or was skipped
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A backend job ended as '$result'."; exit 1 ;;
            esac
          done

      - name: Skip coverage
        if: needs.backend-changes.outputs.run_backend == 'false'
        working-directory: .
        run: echo "No backend-relevant changes; nothing to combine."

      - uses: actions/checkout@v7
        if: needs.backend-changes.outputs.run_backend != 'false'

      - name: Set up Python
        if: needs.backend-changes.outputs.run_backend != 'false'
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        if: needs.backend-changes.outputs.run_backend != 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml
            backend/.python-version

      - name: Install dependencies
        if: needs.backend-changes.outputs.run_backend != 'false'
        run: uv sync --locked --all-extras

      - name: Download coverage data
        if: needs.backend-changes.outputs.run_backend != 'false'
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-shard-*
          path: backend
          merge-multiple: true

      - name: Combine coverage and enforce the floor
        if: needs.backend-changes.outputs.run_backend != 'false'
        run: |
          uv run --no-sync coverage combine .coverage.shard1 .coverage.shard2 .coverage.shard3 .coverage.shard4
          uv run --no-sync coverage xml
          uv run --no-sync coverage report --show-missing --fail-under=60

      - name: Upload coverage report
        if: ${{ always() && needs.backend-changes.outputs.run_backend != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Extract coverage percentage
        if: github.ref == 'refs/heads/main' && needs.backend-changes.outputs.run_backend != 'false'
        id: coverage
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100))")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: github.repository == 'securo-finance/securo' && github.ref == 'refs/heads/main' && needs.backend-changes.outputs.run_backend != 'false'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ae627b744aaa2ba89d850ea541c311be
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

  migration-chain:
    name: Migration Chain
    runs-on: ubuntu-latest

    steps:
      # No `ref:` override, so on a pull request this is the merge with the
      # base branch. That is the whole point: a revision id that only clashes
      # once both sides are together is visible here and nowhere else.
      - uses: actions/checkout@v7

      - name: Test CI change selection
        run: python3 .github/ci/test_changes.py

      - name: Check the Alembic revision chain
        run: python3 backend/scripts/check_migration_chain.py

  doc-paths:
    name: Doc Paths
    runs-on: ubuntu-latest

    steps:
      # Runs on every pull request, whatever it touches: a frontend-only rename
      # can break the map in AGENTS.md just as well as a backend one.
      - uses: actions/checkout@v7

      - name: Check the paths AGENTS.md and the ADRs cite
        run: python3 .github/ci/check_doc_paths.py

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect frontend-relevant changes
        id: frontend-changes
        working-directory: .
        run: python3 .github/ci/changes.py

      - name: Skip frontend checks
        if: steps.frontend-changes.outputs.run_frontend == 'false'
        run: echo "No frontend-relevant changes; skipping frontend checks."

      - name: Set up Node.js
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm ci

      - name: Lint
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm run lint -- --max-warnings=0

      - name: Type check & Build
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm run build

      - name: Run tests
        if: steps.frontend-changes.outputs.run_frontend != 'false'
        run: npm test

  helm-checks:
    name: Helm Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect helm-relevant changes
        id: helm-changes
        run: python3 .github/ci/changes.py

      - name: Skip helm checks
        if: steps.helm-changes.outputs.run_helm == 'false'
        run: echo "No helm-relevant changes; skipping helm lint."

      - name: Set up Helm
        if: steps.helm-changes.outputs.run_helm != 'false'
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Lint Helm Chart
        if: steps.helm-changes.outputs.run_helm != 'false'
        run: helm lint charts/securo

      - name: Validate Helm Chart with Kubeconform
        if: steps.helm-changes.outputs.run_helm != 'false'
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

          helm template securo-test charts/securo | kubeconform -summary -strict
