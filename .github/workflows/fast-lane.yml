name: fast lane

# Merges a low/medium-risk pull request as soon as a reviewer has left an
# approving verdict and CI is green, without a maintainer pressing the button.
#
# Why a workflow and not a bot account: every tool an agent here has for
# merging asks a person to approve that single call, so automating through the
# agent would keep one click per pull request — the exact cost this is meant to
# remove. Merging from inside the repository, with the workflow token, is the
# only path that is actually unattended.
#
# The gates, all of which must hold:
#   1. the PR is against main, not a draft, and has no standing CHANGES_REQUESTED
#   2. it carries `risk: low` or `risk: medium`
#   3. none of its files match BLOCKED_PATHS below
#   4. the three required checks are green on the exact head being merged
#   5. a trusted reviewer left a verdict comment naming that same head SHA
#   6. no unresolved CodeRabbit `Major` or `Critical` thread is left on it
#
# A refusal is also said on the pull request itself, in one comment this
# workflow rewrites in place and deletes once the pull request merges: a run
# log expires, and a pull request with no trace of an evaluation reads as if
# nobody had looked at it. That is visibility only, never a looser gate.
#
# Gate 5 is a comment and not a GitHub review on purpose: posting a review is
# one of the calls that needs a human approval, posting a comment is not. Both
# the marker and the SHA line are HTML comments, so neither renders:
#   <!-- fast-lane: approve -->
#   <!-- sha: <40-hex head SHA> -->
# Nothing internal (SHA included) belongs in visible text: contributors read
# these comments. The SHA is required so a verdict can never carry over to a
# later push, and an edited comment is not a verdict (created_at must equal
# updated_at), so an open PR gets a new comment rather than an edit.
#
# pull_request_target-style events are avoided for the merge itself; this job
# never checks out the pull request's code, it only reads its file list and
# calls the API. Nothing from a contribution is executed here.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, dismissed]
  # Resolving a review thread is a webhook event, not an Actions event:
  # `pull_request_review_thread` is rejected by actionlint and makes this whole
  # file invalid, so it cannot be used. Gate 3b below is a review thread, and
  # resolving one starts no run at all; this hourly sweep re-evaluates every
  # open pull request instead, which also covers any event GitHub did not
  # deliver. `workflow_dispatch` takes one PR number by hand, or none to sweep.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number to evaluate, empty to sweep every open one
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write

concurrency:
  group: fast-lane-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id || github.event.inputs.pr || github.run_id }}
  cancel-in-progress: false

jobs:
  merge:
    # One variable turns the whole thing off without touching this file.
    # A comment can only matter when it carries the verdict marker, so the
    # ordinary conversation on a pull request does not start a run.
    if: >-
      vars.FAST_LANE != 'off' &&
      (github.event_name != 'issue_comment' ||
       contains(github.event.comment.body, '<!-- fast-lane: approve -->'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const OWNER = context.repo.owner, REPO = context.repo.repo;

            // Who may leave a verdict. Same trust boundary as the label axes:
            // an agent pushing through this repository commits as its owner.
            const VERDICT_AUTHORS = ['tassionoronha'];
            const VERDICT = '<!-- fast-lane: approve -->';
            // A pull request opened by this login is never merged by the lane.
            // Every agent pushes as the owner, so a verdict it could leave on
            // its own code would let that code approve itself: `pulls.get`
            // alone cannot tell an agent's comment from the owner's.
            const SELF_APPROVAL_GUARD = ['tassionoronha'];

            const REQUIRED = ['Backend Tests', 'Frontend Checks', 'Helm Checks'];

            // Stricter than `risk: low/medium` on purpose. The label comes from
            // file names, and two of the open medium PRs are a new auth endpoint
            // and a runner that executes plugin code — a path rule that reads
            // only the top directory would wave both through.
            const BLOCKED = [
              [/^backend\/app\/core\/(auth|auth_policy|webauthn|secrets?)/i, 'auth or secrets'],
              [/^backend\/app\/api\/[^/]*auth/i,                      'auth API'],
              // The patterns above only catch a file named *auth* in two
              // directories. Access tokens, passkeys, the MCP server's own
              // auth and the OAuth state are credentials too, and none of
              // them carry "auth" in the name at the right place.
              [/(^|\/)[^/]*(auth|token|secret|credential|passkey|webauthn|oidc|password|login|permission)[^/]*\.(py|ts|tsx|js|jsx)$/i,
                                                                      'auth or credentials'],
              // CI and the repository configuration are not application code:
              // a pull request that can edit them can edit this file and take
              // the gates with it.
              [/^\.github\//,                                         'CI or repository configuration'],
              [/^backend\/alembic\//,                                 'schema migration'],
              [/^backend\/app\/providers\//,                          'bank provider'],
              [/^backend\/app\/services\/.*(sync|plugin)/i,           'sync or plugin'],
              [/^(charts|k8s|helm)\//i,                               'deployment'],
              [/(^|\/)(Dockerfile|docker-compose[^/]*\.(yml|yaml)|install\.sh)$/, 'deployment'],
              [/(^|\/)\.env/,                                         'environment file'],
              [/plugin[-_]runner|runtime\.py$/i,                      'executes third-party code'],
            ];

            // A refusal used to exist only in this run's log, and a log expires:
            // the pull request looked exactly as if nobody had evaluated it, so
            // whoever was watching the queue had to guess which gate held. It is
            // said on the pull request instead, in one comment per pull request
            // that is rewritten in place, so an hourly sweep never stacks the
            // same line.
            //
            // Creating it only when none exists is not enough to keep it one: a
            // sweep and a hand-run of the same pull request sit in different
            // concurrency groups, so both can list the comments before either
            // writes, and two appear. Everything that reads or writes the refusal
            // goes through every comment carrying the marker, so two converge
            // back to one instead of one keeping a stale text forever.
            //
            // Visibility only: nothing here makes a gate more permissive. A pull
            // request that merges loses the refusal comment and keeps the merge
            // one, and every skip keeps its log line above.
            const REFUSAL = '<!-- fast-lane: refused -->';

            async function refusalComments(number) {
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner: OWNER, repo: REPO, issue_number: number, per_page: 100 });
              // Only the lane's own comments, and only this marker: the verdict
              // comments and the merge comment are a different thing entirely.
              return comments.filter((c) => c.user
                && c.user.login === 'github-actions[bot]'
                && (c.body || '').trimStart().startsWith(REFUSAL));
            }

            async function reportRefusal(number, head, why) {
              const body =
                `${REFUSAL}\n\n` +
                `The fast lane evaluated this pull request at \`${head.slice(0, 7)}\` ` +
                `and did not merge it: ${why}.\n\n` +
                `Visibility only — no gate changed. This comment is rewritten in ` +
                `place, so it always names the last commit evaluated.`;
              try {
                const mine = await refusalComments(number);
                if (!mine.length) {
                  await github.rest.issues.createComment(
                    { owner: OWNER, repo: REPO, issue_number: number, body });
                  return;
                }
                // The list comes in creation order: the newest one stays and the
                // rest go, so a racing pair ends as one comment.
                const keep = mine[mine.length - 1];
                if ((keep.body || '').trim() !== body.trim()) {
                  await github.rest.issues.updateComment(
                    { owner: OWNER, repo: REPO, comment_id: keep.id, body });
                }
                for (const extra of mine.slice(0, -1)) {
                  try {
                    await github.rest.issues.deleteComment(
                      { owner: OWNER, repo: REPO, comment_id: extra.id });
                  } catch (e) {
                    core.info(`#${number}: could not delete a repeated refusal: ${e.message}`);
                  }
                }
              } catch (e) {
                // A fork head the token cannot comment on still gets its log
                // line: the refusal is not lost, only less visible.
                core.info(`#${number}: could not report the refusal: ${e.message}`);
              }
            }

            // A pull request that merged must not also say why it did not: the
            // sweep and a hand-run can disagree about the same head, and after
            // the merge only the merge comment is the truth. Best effort on
            // purpose: nothing here fails a merge that already happened.
            async function clearRefusal(number) {
              try {
                for (const c of await refusalComments(number)) {
                  try {
                    await github.rest.issues.deleteComment(
                      { owner: OWNER, repo: REPO, comment_id: c.id });
                  } catch (e) {
                    core.info(`#${number}: could not delete the refusal: ${e.message}`);
                  }
                }
              } catch (e) {
                core.info(`#${number}: could not read the refusal comment: ${e.message}`);
              }
            }

            // Everything below runs for one pull request. It returns the refusal
            // ({ why, head }) when a gate does not hold, so the caller can say it
            // on the pull request, and null when it merged or when there was
            // nothing worth saying there.
            async function tryMerge(number) {
              let head = null;
              // A closed, draft or wrong-base pull request is refused before the
              // lane would consider it at all, and the pull request itself
              // already shows that: a comment there would be noise, so these
              // three return null. Every gate below them is reported.
              const skip = (why) => {
                core.info(`#${number}: not merging — ${why}`);
                return head ? { why, head } : null;
              };

              let pr;
              try {
                ({ data: pr } = await github.rest.pulls.get(
                  { owner: OWNER, repo: REPO, pull_number: number }));
              } catch (e) { return skip('cannot read the pull request'); }

              if (pr.state !== 'open')      return skip('it is not open');
              if (pr.draft)                 return skip('it is a draft');
              if (pr.base.ref !== 'main')   return skip(`it targets ${pr.base.ref}`);

              head = pr.head.sha;

              const labels = pr.labels.map((l) => l.name);
              const risk = labels.filter((l) => l.startsWith('risk: ')).map((l) => l.slice(6));
              if (risk.length !== 1 || !['low', 'medium'].includes(risk[0])) {
                return skip(`risk is ${risk.join('/') || 'unlabelled'}`);
              }

              // ---- 2. files that never take the fast lane -------------------
              const files = await github.paginate(github.rest.pulls.listFiles,
                { owner: OWNER, repo: REPO, pull_number: number, per_page: 100 });
              // GitHub caps this list at 3,000 files even with pagination, so a blocked
              // file past that cut would be invisible. `changed_files` is the count the
              // pull request reports: when the two differ, files went unread.
              if (files.length !== pr.changed_files) {
                return skip(`read ${files.length} of ${pr.changed_files} changed files`);
              }
              // A rename reports the new path in `filename` and the old one in
              // `previous_filename`: moving a migration, an auth file or this
              // workflow out of its directory would otherwise pass the list.
              for (const f of files) {
                for (const p of [f.filename, f.previous_filename].filter(Boolean)) {
                  for (const [re, what] of BLOCKED) {
                    if (re.test(p)) return skip(`${p} is ${what}`);
                  }
                }
              }

              // ---- 3. a standing request for changes blocks the merge -------
              const reviews = await github.paginate(github.rest.pulls.listReviews,
                { owner: OWNER, repo: REPO, pull_number: number, per_page: 100 });
              const latest = new Map();
              // GitHub keeps a CHANGES_REQUESTED standing until it is dismissed,
              // even if the same reviewer later leaves a plain comment. Storing
              // every state would let a COMMENTED review clear the block.
              for (const r of reviews) {
                if (r.user && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) {
                  latest.set(r.user.login, r.state);
                }
              }
              const blocked = [...latest].filter(([, s]) => s === 'CHANGES_REQUESTED');
              if (blocked.length) {
                return skip(`changes requested by ${blocked.map(([u]) => u).join(', ')}`);
              }

              // ---- 3b. an unresolved CodeRabbit major thread blocks the merge
              // CodeRabbit only ever leaves a COMMENTED review, so the check
              // above never sees its findings. A thread counts as triaged when
              // someone resolves it; only `Major` and `Critical` hold the merge.
              {
                const query = `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) {
                        pageInfo { hasNextPage }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 5) {
                            pageInfo { hasNextPage }
                            nodes { author { login } body }
                          }
                        }
                      }
                    }
                  }
                }`;
                let threads = null;
                try {
                  const data = await github.graphql(query,
                    { owner: OWNER, repo: REPO, number });
                  threads = (data.repository.pullRequest || {}).reviewThreads || null;
                } catch (e) {
                  return skip(`cannot read the review threads: ${e.message}`);
                }
                // A gate that needs every thread must fail closed when it can
                // only read some of them: a blocker past the first 100 threads,
                // or past the fifth comment of one, would otherwise be invisible.
                if (!threads) return skip('the review threads came back empty');
                if (threads.pageInfo && threads.pageInfo.hasNextPage) {
                  return skip('more review threads than this gate can read');
                }
                const truncated = (threads.nodes || []).some((t) =>
                  t.comments && t.comments.pageInfo && t.comments.pageInfo.hasNextPage);
                if (truncated) {
                  return skip('more comments on a thread than this gate can read');
                }
                const open = (threads.nodes || [])
                  .filter((t) => !t.isResolved && !t.isOutdated)
                  .filter((t) => (t.comments.nodes || []).some((c) =>
                    c.author && c.author.login === 'coderabbitai'
                    && /\b(major|critical)\b/i.test(c.body || '')));
                if (open.length) {
                  return skip(`${open.length} unresolved CodeRabbit major thread(s)`);
                }
              }

              // ---- 4. the verdict names the head we are about to merge ------
              if (SELF_APPROVAL_GUARD.includes(pr.user.login)) {
                return skip(`opened by ${pr.user.login}: agent code is not merged by the lane`);
              }
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner: OWNER, repo: REPO, issue_number: number, per_page: 100 });
              // The marker must open the comment, so quoting a verdict in the
              // conversation cannot pass as one; an edited comment never counts,
              // because a verdict is a statement about one head, written once.
              const verdict = comments.filter((c) =>
                c.user && VERDICT_AUTHORS.includes(c.user.login)
                && (c.body || '').trimStart().startsWith(VERDICT)
                && (!c.updated_at || c.created_at === c.updated_at)
                && new RegExp(`sha:\\s*${head}\\b`).test(c.body || '')).pop();
              if (!verdict) return skip(`no verdict for ${head.slice(0, 7)}`);

              // ---- 5. green, on that exact head ----------------------------
              const { data: checks } = await github.rest.checks.listForRef(
                { owner: OWNER, repo: REPO, ref: head, per_page: 100 });
              // A re-run leaves several entries per name: keep the newest one.
              const byName = new Map();
              for (const c of checks.check_runs) {
                const seen = byName.get(c.name);
                if (!seen || (c.started_at || '') > (seen.started_at || '')) {
                  byName.set(c.name, c);
                }
              }
              for (const name of REQUIRED) {
                const c = byName.get(name);
                if (!c)                    return skip(`no ${name} run on ${head.slice(0, 7)}`);
                if (c.status !== 'completed')  return skip(`${name} is ${c.status}`);
                if (c.conclusion !== 'success') return skip(`${name} is ${c.conclusion}`);
              }

              // ---- merge, pinned to the head the verdict was given for -----
              // Passing `sha` makes GitHub refuse if the branch moved after the
              // checks above, which is the race a plain merge would have.
              try {
                await github.rest.pulls.merge({
                  owner: OWNER, repo: REPO, pull_number: number,
                  sha: head, merge_method: 'squash',
                });
              } catch (e) {
                return skip(`the merge call failed: ${e.message}`);
              }

              // A push made with GITHUB_TOKEN starts no workflow run, so the
              // `push` run on main that ci.yml describes never fires here. The
              // head was verified before the merge; this validates the squash
              // commit itself, and a failure is visible in Actions.
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: OWNER, repo: REPO, workflow_id: 'ci.yml',
                  ref: 'main',
                });
              } catch (e) {
                core.warning(`could not dispatch CI on main: ${e.message}`);
              }

              await github.rest.issues.createComment({
                owner: OWNER, repo: REPO, issue_number: number,
                body: `Merged by the fast lane: \`risk: ${risk[0]}\`, ` +
                      `verdict at ${head.slice(0, 7)} by ${verdict.user.login} ` +
                      `(${verdict.html_url}), ${REQUIRED.join(', ')} green. ` +
                      `Anything touching auth, secrets, migrations, bank sync, ` +
                      `plugins or deployment still waits for a maintainer.`,
              });

              // An earlier evaluation may have refused this pull request and be
              // still on it; that comment is now false.
              await clearRefusal(number);

              return null;
            }

            // ---- 0. which pull request is this event about? ----------------
            const ev = context.eventName;
            let number = null;
            if (ev === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') return;
              // A push to main has no pull request: nothing to merge.
              if (run.event !== 'pull_request') return;
              const prs = run.pull_requests || [];
              // GitHub does not always fill `pull_requests` for fork heads, so
              // fall back to looking the branch up. It must be unambiguous.
              if (prs.length === 1) {
                number = prs[0].number;
              } else {
                const own = run.head_repository && run.head_repository.owner
                  ? run.head_repository.owner.login : OWNER;
                const { data: open } = await github.rest.pulls.list({
                  owner: OWNER, repo: REPO, state: 'open',
                  head: `${own}:${run.head_branch}`, per_page: 5,
                });
                if (open.length !== 1) return;
                number = open[0].number;
              }
            } else if (ev === 'issue_comment') {
              if (!context.payload.issue.pull_request) return;
              number = context.payload.issue.number;
            } else if (context.payload.pull_request) {
              number = context.payload.pull_request.number;
            } else if (ev === 'workflow_dispatch') {
              number = Number(context.payload.inputs && context.payload.inputs.pr) || null;
            }

            if (number) {
              const refusal = await tryMerge(number);
              if (refusal) await reportRefusal(number, refusal.head, refusal.why);
            } else if (ev === 'schedule' || ev === 'workflow_dispatch') {
              // The sweep: every open pull request goes through the same gates,
              // so a thread resolved with no other event still gets merged.
              const open = await github.paginate(github.rest.pulls.list,
                { owner: OWNER, repo: REPO, state: 'open', per_page: 100 });
              core.info(`sweeping ${open.length} open pull requests`);
              for (const p of open) {
                try {
                  const refusal = await tryMerge(p.number);
                  if (refusal) await reportRefusal(p.number, refusal.head, refusal.why);
                } catch (e) {
                  core.info(`#${p.number}: ${e.message}`);
                }
              }
            }
