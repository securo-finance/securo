name: securo

# podman-compose groups all services into a single pod by default, which
# interferes with per-service port mapping and networking. Disabling it makes
# podman-compose behave like Docker Compose. Docker ignores unknown top-level
# x- keys.
x-podman:
  in_pod: false

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/securo
  # Connections the API keeps open and the extra ones a burst may open. Raise
  # both with the database's max_connections when many people share the
  # instance; the defaults are in backend/app/core/config.py (#1901).
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  # Plan each query with the values of the call that runs it, which keeps
  # reports on a large history fast. Set it to false to keep the server's own
  # plan_cache_mode, which is what an instance behind a connection pooler that
  # refuses the parameter needs (#584).
  DB_FORCE_CUSTOM_PLANS: ${DB_FORCE_CUSTOM_PLANS:-true}
  # Optional. Left empty, Securo generates a unique key on first start and
  # keeps it in the database. Set one (openssl rand -hex 32) to manage it yourself.
  SECRET_KEY: ${SECRET_KEY:-}
  # true refuses to start without a SECRET_KEY of your own.
  REQUIRE_SECRET_KEY: ${REQUIRE_SECRET_KEY:-false}
  DEBUG: ${DEBUG:-true}
  # Not nested (${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}):
  # podman-compose before 1.6.0 leaves a stray "}" on such values (#1162).
  # Empty FRONTEND_URL makes the backend use http://localhost:$FRONTEND_PORT.
  FRONTEND_URL: ${FRONTEND_URL:-}
  FRONTEND_PORT: ${FRONTEND_PORT:-3000}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Securo}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
  PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
  PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
  PLUGGY_OAUTH_REDIRECT_URI: ${PLUGGY_OAUTH_REDIRECT_URI:-}
  ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
  ENABLE_BANKING_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRIVATE_KEY_FILE:-/app/secrets/enable_banking_private.pem}
  ENABLE_BANKING_API_URL: ${ENABLE_BANKING_API_URL:-https://api.enablebanking.com}
  ENABLE_BANKING_OAUTH_REDIRECT_URI: ${ENABLE_BANKING_OAUTH_REDIRECT_URI:-}
  SIMPLEFIN_ENABLED: ${SIMPLEFIN_ENABLED:-false}
  SIMPLEFIN_API_URL: ${SIMPLEFIN_API_URL:-https://beta-bridge.simplefin.org}
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OIDC}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_AUTO_REGISTER: ${OIDC_AUTO_REGISTER:-true}
  OIDC_EXISTING_USER_LINK_MODE: ${OIDC_EXISTING_USER_LINK_MODE:-disabled}
  OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
  OIDC_SYNC_ROLES: ${OIDC_SYNC_ROLES:-false}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-groups}
  OIDC_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-}
  OIDC_WORKSPACE_ROLE_MAP: ${OIDC_WORKSPACE_ROLE_MAP:-}
  LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
  # No default, so an unset value leaves backend/.env and the app default to decide.
  REGISTRATION_ENABLED:
  # No default, same reason: unset keeps the app default (off).
  MANAGED_INSTANCE:
  REDIS_URL: redis://redis:6379/0
  BANK_SYNC_MIN_INTERVAL_HOURS: ${BANK_SYNC_MIN_INTERVAL_HOURS:-4}
  OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
  FX_SYNC_MODE: ${FX_SYNC_MODE:-on_demand}
  TESOURO_DIRETO_ENABLED: ${TESOURO_DIRETO_ENABLED:-true}
  PERFORMANCE_BENCHMARKS_ENABLED: ${PERFORMANCE_BENCHMARKS_ENABLED:-true}
  # Data plugins (categories and rules) from the plugin catalog, opt-in.
  # No extra container: the catalog is fetched only when someone opens it.
  PLUGINS_ENABLED: ${PLUGINS_ENABLED:-false}
  PLUGINS_INDEX_URL: ${PLUGINS_INDEX_URL:-https://plugins.usesecuro.com/v1/index.json}
  # Plugins with code run in the plugins-runner container below, started only
  # with `--profile plugins`. Blank PLUGINS_RUNNER_URL: no plugin with code.
  PLUGINS_RUNNER_URL: ${PLUGINS_RUNNER_URL:-}
  PLUGINS_RUNNER_TOKEN: ${PLUGINS_RUNNER_TOKEN:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_LOCAL_PATH: /app/data/attachments
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
  STORAGE_S3_ALLOW_INSECURE_HTTP: ${STORAGE_S3_ALLOW_INSECURE_HTTP:-false}
  STORAGE_S3_ADDRESSING_STYLE: ${STORAGE_S3_ADDRESSING_STYLE:-auto}
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
  STORAGE_S3_SESSION_TOKEN: ${STORAGE_S3_SESSION_TOKEN:-}
  AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
  # Agents/LLM feature, opt-in. Off by default so existing users pay
  # zero cost. Run `docker compose --profile agents up` after enabling.
  AGENTS_ENABLED: ${AGENTS_ENABLED:-false}
  AGENTS_BUILTIN_MCP_URL: ${AGENTS_BUILTIN_MCP_URL:-http://mcp-server:8765/mcp}
  # Public URL external agents use to reach the built-in MCP server, shown in
  # the "External MCP access" panel. Blank → the UI derives it from the browser
  # (host:8765). Set when the MCP server sits behind an ingress/reverse proxy.
  AGENTS_EXTERNAL_MCP_URL: ${AGENTS_EXTERNAL_MCP_URL:-}
  AGENTS_EXTRA_MCP_SERVERS: ${AGENTS_EXTRA_MCP_SERVERS:-}
  # Per-IP ceiling on assistant chat messages, in requests per minute. Every
  # message spends provider tokens, so lower it (5, for example) on a public
  # demo. A turn that runs several tools is still one request. 0 turns off.
  AGENTS_CHAT_RATE_LIMIT_PER_MINUTE: ${AGENTS_CHAT_RATE_LIMIT_PER_MINUTE:-30}
  # Signs the MCP server's JWTs. Empty derives it from SECRET_KEY, so an
  # install with a random SECRET_KEY needs no extra configuration. There is no
  # default value on purpose: a public one would let anyone mint a token for
  # any user (#1174). A known public value is refused at startup.
  AGENTS_MCP_JWT_SECRET: ${AGENTS_MCP_JWT_SECRET:-}
  # TTL for tokens minted from /agents/connections → "External MCP access".
  # Used by Claude Desktop, n8n, custom clients plugging into Securo.
  AGENTS_MCP_EXTERNAL_TTL_DAYS: ${AGENTS_MCP_EXTERNAL_TTL_DAYS:-90}
  # Browser origins the MCP server accepts, comma-separated. Blank admits
  # none; the agent runtime, gateways and desktop clients send no Origin.
  AGENTS_MCP_ALLOWED_ORIGINS: ${AGENTS_MCP_ALLOWED_ORIGINS:-}
  # LLM provider config: only the provider you actually use needs setting.
  AGENTS_DEFAULT_PROVIDER: ${AGENTS_DEFAULT_PROVIDER:-ollama}
  AGENTS_DEFAULT_MODEL: ${AGENTS_DEFAULT_MODEL:-}
  AGENTS_OLLAMA_BASE_URL: ${AGENTS_OLLAMA_BASE_URL:-http://ollama:11434}
  AGENTS_OPENAI_API_KEY: ${AGENTS_OPENAI_API_KEY:-}
  AGENTS_ANTHROPIC_API_KEY: ${AGENTS_ANTHROPIC_API_KEY:-}
  AGENTS_OPENAI_COMPAT_BASE_URL: ${AGENTS_OPENAI_COMPAT_BASE_URL:-}
  AGENTS_OPENAI_COMPAT_API_KEY: ${AGENTS_OPENAI_COMPAT_API_KEY:-}
  # Knowledge-base embeddings. `native` (default) uses fastembed with a
  # bundled multilingual model, so zero external setup. Override with
  # ollama/openai/openai_compatible for better quality.
  AGENTS_EMBEDDING_PROVIDER: ${AGENTS_EMBEDDING_PROVIDER:-native}
  AGENTS_EMBEDDING_MODEL: ${AGENTS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  # Password recovery by email (ADR 0044), off by default: with EMAIL_ENABLED
  # unset nothing leaves the machine and the forgot-password route answers 503.
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  # Who carries the message: smtp (your own relay) or resend (hosted API).
  # With resend nothing under SMTP_* is read; only the RESEND_* values.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  # starttls | ssl | none. `none` sends the credentials in the clear.
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-60}

x-backend-base: &backend-base
  build: ./backend
  environment: *backend-env
  # Lets a connection point at a model server running on the host (LM Studio,
  # Ollama, llama.cpp) as http://host.docker.internal:<port>. Docker Desktop
  # resolves the name on its own; this makes it work on Linux too.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # podman-compose up to 1.6.0 ignores `migrate`'s exit code, so each service
  # also refuses to start until the schema is at head.
  entrypoint: ["sh", "-c", 'alembic current --check-heads && exec "$$@"', "sh"]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  volumes:
    - ./backend:/app
    - ./secrets:/app/secrets:ro
    - attachments:/app/data/attachments
    # Managed/scheduled backup ZIPs are written inside containers to /app/data/backups.
    # Set BACKUP_HOST_PATH to expose that internal directory wherever you want on
    # the host, e.g. BACKUP_HOST_PATH=/srv/securo/backups.
    - ${BACKUP_HOST_PATH:-./data/backups}:/app/data/backups
    - agent_knowledge:/app/data/agent_knowledge
    - agent_embedding_models:/app/data/embedding_models
  # `plugins` is internal: it lets the backend reach the plugin runner and
  # nothing else. It costs nothing while the `plugins` profile is off.
  networks: [default, plugins]
  restart: unless-stopped

services:
  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    # docker.io/pgvector/pgvector:pg16 is a drop-in replacement for postgres:16
    # that ships the `vector` extension. Required for the agents
    # knowledge base; harmless when AGENTS_ENABLED=false.
    image: ${DB_IMAGE:-docker.io/pgvector/pgvector:pg16}
    restart: unless-stopped
    # JIT compilation costs more than it saves on the short, indexed queries
    # Securo runs. On the hosted instance a plain GET /api/transactions went
    # from 1222 ms to 229 ms with it off, and 100k-transaction workspaces
    # followed (560 ms). DB_JIT=on restores the PostgreSQL default (#583).
    command: ["postgres", "-c", "jit=${DB_JIT:-off}"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot migration job. Everything that touches the schema waits for it
  # to exit 0, so workers never race `alembic upgrade head`, and a failed
  # migration stops the stack instead of serving a half-migrated database.
  migrate:
    <<: *backend-base
    restart: "no"
    # Replaces the anchor's schema check and migrate gate, which would make
    # migrate wait on itself. YAML merge is shallow, so db/redis are restated.
    entrypoint: ["alembic"]
    command: upgrade head
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  backend:
    <<: *backend-base
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      start_period: 30s
      retries: 12
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    environment:
      BACKEND_URL: http://backend:8000
      # Also drives Vite's allowedHosts, so a proxied domain is not blocked.
      FRONTEND_URL: ${FRONTEND_URL:-}
      APP_VERSION_ROOT: /workspace
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - ./frontend:/app
      - ./:/workspace:ro
      - /app/node_modules
    restart: unless-stopped

  celery-worker:
    <<: *backend-base
    # Limit to 2 workers to save RAM (default = number of CPUs).
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  celery-beat:
    <<: *backend-base
    command: celery -A app.worker beat --loglevel=info

  # Optional: Securo built-in MCP server. Only starts under the `agents`
  # profile (`docker compose --profile agents up`). Reuses the backend
  # image, just runs a different uvicorn entry point. Modular by design:
  # users not using the agents feature pay zero cost.
  #
  # The port is published on the host (127.0.0.1 by default) so external
  # agents (Claude Desktop, n8n, custom clients) can reach it after
  # minting a token from the UI. JWT auth is always required. Override
  # AGENTS_MCP_EXTERNAL_HOST_PORT to e.g. "0.0.0.0:8765" to expose to LAN.
  mcp-server:
    <<: *backend-base
    profiles: [agents]
    command: uvicorn mcp_server.main:app --host 0.0.0.0 --port 8765
    ports:
      - "${AGENTS_MCP_EXTERNAL_HOST_PORT:-127.0.0.1:8765}:8765"

  # Optional: plugins with code. Only start under the `plugins` profile
  # (`docker compose --profile plugins up`, with PLUGINS_ENABLED=true,
  # PLUGINS_RUNNER_URL=http://plugins-runner:8090, and PLUGINS_RUNNER_TOKEN and
  # PLUGINS_EGRESS_SECRET set to long random values: there is no default, since
  # plugin code runs next to the runner's API). Same image as the backend,
  # but none of its environment: no SECRET_KEY, no database, no provider keys.
  # The runner sits only on the internal `plugins` network, so it can't reach
  # the database, Redis or the internet; each plugin runs as its own user and
  # goes out only through plugins-egress, to the hosts it declared.
  plugins-runner:
    build: ./backend
    profiles: [plugins]
    command: uvicorn --factory plugin_runner.main:create_app --host 0.0.0.0 --port 8090
    environment:
      PLUGINS_RUNNER_TOKEN: ${PLUGINS_RUNNER_TOKEN:-}
      PLUGINS_EGRESS_SECRET: ${PLUGINS_EGRESS_SECRET:-}
      PLUGINS_EGRESS_PROXY: plugins-egress:3128
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Only the runner's own code, never the whole backend folder: a plugin
      # could read backend/.env or secrets from it.
      - ./backend/plugin_runner:/app/plugin_runner:ro
      - plugins:/var/lib/securo-plugins
    networks: [plugins]
    read_only: true
    tmpfs: [/tmp]
    # Root only to hand each plugin its own user and clean up after it.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: ["no-new-privileges:true"]
    # An init reaps what killed plugin processes leave behind (the runner isn't PID 1).
    init: true
    # Caps for everything plugins start together (each call also has its own limits).
    pids_limit: 512
    mem_limit: ${PLUGINS_RUNNER_MEMORY:-2g}
    restart: unless-stopped

  # The plugins' only way out: a CONNECT proxy that checks each plugin's signed
  # pass against the hosts it declared and refuses private addresses. TLS goes
  # through untouched (client certificates keep working).
  plugins-egress:
    build: ./backend
    profiles: [plugins]
    command: python -m plugin_runner.egress
    environment:
      PLUGINS_EGRESS_SECRET: ${PLUGINS_EGRESS_SECRET:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend/plugin_runner:/app/plugin_runner:ro
    networks: [default, plugins]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    restart: unless-stopped

networks:
  # Declared so podman-compose accepts services that name it alongside `plugins`.
  default: {}
  plugins:
    internal: true

volumes:
  plugins:
  pgdata:
  attachments:
  agent_knowledge:
  agent_embedding_models:
