# United Kingdom. Its VAT numbers still fit the shared shape, so they use the
# same kind; only the country prefix differs.
code = "GB"
kinds = ["vat"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
