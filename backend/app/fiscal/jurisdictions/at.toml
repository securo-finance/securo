# Austria. The UID-Nummer is the VAT number; the domestic Steuernummer
# does not go on an invoice.
code = "AT"
kinds = ["vat"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
