# Portugal. The NIF identifies companies and individuals alike; VAT is the
# intra-EU number for cross-border invoicing.
code = "PT"
kinds = ["pt_nif", "vat"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
