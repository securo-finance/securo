# Italy. Partita IVA for businesses, Codice Fiscale for individuals, and the
# SDI destination code that e-invoicing routes on.
code = "IT"
kinds = ["partita_iva", "codice_fiscale", "sdi", "vat"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
