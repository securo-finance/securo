# United States. The EIN is the business identifier; there is no nationwide
# individual equivalent that belongs on an invoice.
code = "US"
kinds = ["ein"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
