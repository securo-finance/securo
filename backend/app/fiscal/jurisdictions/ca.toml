# Canada. The Business Number is the root; GST/HST adds an RT program
# suffix to it.
code = "CA"
kinds = ["ca_bn"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
