# Poland. The NIP is the tax number; the intra-EU VAT id is the same
# digits behind a PL prefix.
code = "PL"
kinds = ["nip", "vat"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
