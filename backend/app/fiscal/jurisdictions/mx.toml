# Mexico. The RFC covers companies and individuals, the trailing homoclave
# being what distinguishes two taxpayers with the same name and birth date.
code = "MX"
kinds = ["rfc"]

# The SAT catalog keys every CFDI line: a product or service code and a
# unit code, both from the official lists.
[[product_fields]]
key = "sat_product_code"
[[product_fields]]
key = "sat_unit_code"
