# Australia. The ABN goes on every tax invoice; the ACN it derives from
# identifies the company at ASIC.
code = "AU"
kinds = ["abn"]

# Goods crossing a border carry a Harmonized System code; a barcode is
# what most catalogs already have.
[[product_fields]]
key = "hs_code"
kinds = ["product"]
[[product_fields]]
key = "gtin"
kinds = ["product"]
