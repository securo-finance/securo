# Local fork overlay — builds the backend and frontend from this working tree
# instead of pulling ghcr.io/securo-finance/*:latest.
#
# Use it alongside the prod stack, never on its own:
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build
#
# Each Dockerfile COPYs from its own directory (backend/pyproject.toml,
# frontend/package.json), so the context is the subdirectory, not the repo
# root. Images are retagged locally so they neither shadow nor get clobbered
# by the upstream ones on a `pull`.
services:
  backend:
    build:
      context: ./backend
    image: securo-backend:local
    pull_policy: never

  frontend:
    build:
      context: ./frontend
    image: securo-frontend:local
    pull_policy: never

  celery-worker:
    build:
      context: ./backend
    image: securo-backend:local
    pull_policy: never

  celery-beat:
    build:
      context: ./backend
    image: securo-backend:local
    pull_policy: never
