apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "securo.fullname" . }}-frontend-nginx
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf.template: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Attachments go up to STORAGE_MAX_FILE_SIZE_MB (10 MB); nginx's default limit is 1 MB.
        # Mirrors frontend/default.conf.template.
        client_max_body_size 15m;

        # API proxy to backend.
        # Resolve the backend hostname at request time instead of caching the IP
        # at startup. Without this, Nginx pins the upstream IP when the config
        # loads and returns 502s after the backend pod is recreated with a new
        # IP. Using a variable in proxy_pass forces re-resolution; NGINX_RESOLVER
        # is derived from the pod's own /etc/resolv.conf (cluster DNS) by the
        # image's docker-entrypoint.d/19-resolver.envsh.
        location /api/ {
            resolver ${NGINX_RESOLVER} valid=5s;
            set $upstream ${BACKEND_URL};
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Connecting a bank imports its whole history in this one request,
        # which can outlast nginx's default 60s read timeout (issue #1148).
        # Mirrors frontend/default.conf.template.
        location = /api/connections/oauth/callback {
            resolver ${NGINX_RESOLVER} valid=5s;
            set $upstream ${BACKEND_URL};
            proxy_pass $upstream;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Never cache index.html so new deployments are always picked up immediately.
        # The SPA fallback below reaches this block through an internal redirect,
        # and add_header here replaces the fallback's, so every app route served as
        # index.html (/transactions, /accounts/...) gets its noindex from here.
        # Mirrors frontend/default.conf.template.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri =404;
        }

        # The service worker must always be revalidated, or clients keep running a
        # stale one after a deploy.
        location = /sw.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        # The entry page stays indexable; every other app route (accounts,
        # transactions, settings...) is private data and gets noindex, so a URL
        # that leaks into a search engine is dropped from its index. try_files
        # serves the file here without a redirect, so this block needs the same
        # no-cache header as /index.html. Mirrors frontend/default.conf.template.
        location = / {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files /index.html =404;
        }

        # SPA fallback — serve index.html for all non-file routes
        location / {
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri $uri/ /index.html;
        }
    }
