apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "securo.fullname" . }}-frontend-nginx
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf.template: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # API proxy to backend.
        # Resolve the backend hostname at request time instead of caching the IP
        # at startup. Without this, Nginx pins the upstream IP when the config
        # loads and returns 502s after the backend pod is recreated with a new
        # IP. Using a variable in proxy_pass forces re-resolution; NGINX_RESOLVER
        # is derived from the pod's own /etc/resolv.conf (cluster DNS) by the
        # image's docker-entrypoint.d/19-resolver.envsh.
        location /api/ {
            resolver ${NGINX_RESOLVER} valid=5s;
            set $upstream ${BACKEND_URL};
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Never cache index.html so new deployments are always picked up immediately
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files $uri =404;
        }

        # SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
