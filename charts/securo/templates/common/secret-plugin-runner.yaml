{{- if and .Values.pluginRunner.enabled (not .Values.pluginRunner.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "securo.pluginRunnerSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "securo.pluginRunnerSecretName" . }}
  labels:
    {{- include "securo.labels" . | nindent 4 }}
type: Opaque
data:
  PLUGINS_RUNNER_TOKEN: {{ if $existing }}{{ index $existing.data "PLUGINS_RUNNER_TOKEN" | quote }}{{ else }}{{ randBytes 32 | b64enc | quote }}{{ end }}
  PLUGINS_EGRESS_SECRET: {{ if $existing }}{{ index $existing.data "PLUGINS_EGRESS_SECRET" | quote }}{{ else }}{{ randBytes 32 | b64enc | quote }}{{ end }}
{{- end }}
