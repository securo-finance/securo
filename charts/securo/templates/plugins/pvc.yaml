{{- if and (include "securo.pluginsRunnerEnabled" .) .Values.plugins.runner.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "securo.fullname" . }}-plugins-data
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins
  annotations:
    # Keep installed plugin code when the runner is disabled or the release is
    # pruned; turning the runner back on mounts the same claim.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - {{ .Values.plugins.runner.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.plugins.runner.persistence.size | quote }}
  {{- if .Values.plugins.runner.persistence.storageClass }}
  {{- if (eq "-" .Values.plugins.runner.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ .Values.plugins.runner.persistence.storageClass }}"
  {{- end }}
  {{- end }}
{{- end }}
