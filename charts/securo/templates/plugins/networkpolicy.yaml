{{- if and .Values.plugins.runner.enabled .Values.plugins.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "securo.fullname" . }}-plugins-runner
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins-runner
spec:
  podSelector:
    matchLabels:
      {{- include "securo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: plugins-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "securo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              {{- include "securo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: celery-worker
      ports:
        - port: {{ .Values.plugins.runner.service.port }}
          protocol: TCP
  egress:
    {{- if .Values.plugins.egress.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "securo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: plugins-egress
      ports:
        - port: {{ .Values.plugins.egress.port }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- if .Values.plugins.egress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "securo.fullname" . }}-plugins-egress
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins-egress
spec:
  podSelector:
    matchLabels:
      {{- include "securo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: plugins-egress
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "securo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: plugins-runner
      ports:
        - port: {{ .Values.plugins.egress.port }}
          protocol: TCP
  egress:
    # Anything, because the proxy itself is what refuses private addresses and
    # hosts the plugin did not declare.
    - {}
{{- end }}
{{- end }}
