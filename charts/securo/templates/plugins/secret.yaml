{{- if and (include "securo.pluginsRunnerEnabled" .) (not .Values.plugins.runner.existingSecret) }}
{{- $name := include "securo.pluginsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $runnerToken := .Values.plugins.runner.token | default (randAlphaNum 48) }}
{{- $egressSecret := .Values.plugins.runner.egressSecret | default (randAlphaNum 48) }}
{{- if $existing }}
{{- if and (not .Values.plugins.runner.token) (hasKey $existing.data "PLUGINS_RUNNER_TOKEN") }}
{{- $runnerToken = index $existing.data "PLUGINS_RUNNER_TOKEN" | b64dec }}
{{- end }}
{{- if and (not .Values.plugins.runner.egressSecret) (hasKey $existing.data "PLUGINS_EGRESS_SECRET") }}
{{- $egressSecret = index $existing.data "PLUGINS_EGRESS_SECRET" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins
type: Opaque
data:
  PLUGINS_RUNNER_TOKEN: {{ $runnerToken | b64enc | quote }}
  PLUGINS_EGRESS_SECRET: {{ $egressSecret | b64enc | quote }}
{{- end }}
