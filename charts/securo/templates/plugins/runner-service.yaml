{{- if include "securo.pluginsRunnerEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "securo.fullname" . }}-plugins-runner
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins-runner
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.plugins.runner.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "securo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: plugins-runner
{{- end }}
