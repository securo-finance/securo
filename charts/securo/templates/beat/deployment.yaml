{{- if .Values.celeryBeat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "securo.fullname" . }}-beat
  labels:
    {{- include "securo.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "securo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
        {{- if and .Values.plugins.runner.enabled (not .Values.plugins.runner.existingSecret) }}
        checksum/plugins-secret: {{ include "securo.pluginsSecretChecksum" . }}
        {{- end }}
      labels:
        {{- include "securo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.celeryBeat.image.pullPolicy }}
          command:
            - celery
            - -A
            - app.worker
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: {{ include "securo.fullname" . }}-config
            - secretRef:
                {{- if .Values.global.existingSecret }}
                name: {{ .Values.global.existingSecret }}
                {{- else }}
                name: {{ include "securo.fullname" . }}-secrets
                {{- end }}
            {{- with .Values.celeryBeat.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.plugins.runner.enabled .Values.celeryBeat.extraEnv }}
          env:
            {{- if .Values.plugins.runner.enabled }}
            - name: PLUGINS_ENABLED
              value: "true"
            - name: PLUGINS_API_URL
              value: {{ printf "http://%s-backend:8000/api" (include "securo.fullname" .) | quote }}
            - name: PLUGINS_RUNNER_URL
              value: {{ printf "http://%s-plugins-runner:%v" (include "securo.fullname" .) .Values.plugins.runner.service.port | quote }}
            - name: PLUGINS_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "securo.pluginsSecretName" . }}
                  key: PLUGINS_RUNNER_TOKEN
            {{- end }}
            {{- with .Values.celeryBeat.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.attachments.enabled }}
            - name: attachments
              mountPath: /app/data/attachments
            {{- end }}
            {{- if .Values.persistence.backups.enabled }}
            - name: backups
              mountPath: /app/data/backups
            {{- end }}
            {{- if and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentKnowledge.enabled }}
            - name: agent-knowledge
              mountPath: /app/data/agent_knowledge
            {{- end }}
            {{- if and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentEmbeddingModels.enabled }}
            - name: agent-embedding-models
              mountPath: /app/data/embedding_models
            {{- end }}
            {{- with .Values.celeryBeat.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.celeryBeat.resources }}
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.attachments.enabled }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ include "securo.attachmentsClaimName" . }}
        {{- end }}
        {{- if .Values.persistence.backups.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "securo.fullname" . }}-backups
        {{- end }}
        {{- if and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentKnowledge.enabled }}
        - name: agent-knowledge
          persistentVolumeClaim:
            claimName: {{ include "securo.fullname" . }}-agent-knowledge
        {{- end }}
        {{- if and (eq (.Values.config.agentsEnabled | toString) "true") .Values.persistence.agentEmbeddingModels.enabled }}
        - name: agent-embedding-models
          persistentVolumeClaim:
            claimName: {{ include "securo.fullname" . }}-agent-embedding-models
        {{- end }}
        {{- with .Values.celeryBeat.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
